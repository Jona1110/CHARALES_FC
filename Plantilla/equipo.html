<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantel Oficial | Charales de Chapala</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" type="image/png" href="../imagen.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="../index.html" class="logo">
                <img src="../image.png" alt="Escudo Charales">
                <span>CHARALES</span>
            </a>
        </div>
    </nav>

    <header class="page-header">
        <h1>NUESTROS <span class="txt-blue">GUERREROS</span></h1>
        <p class="txt-gray">Plantilla Oficial - Temporada 2026/2027</p>
    </header>

    <main class="roster-section">
        <!-- Porteros -->
        <h2 class="roster-category">PORTEROS</h2>
        <div class="roster-grid">
            <article class="player-profile">
                <div class="player-photo">
                    <!-- Sustituir con foto real en formato PNG sin fondo -->
                    <img src="../imagen.png" alt="Jugador" style="border-radius:0; border:none; padding:0; width:150px; opacity:0.8;">
                </div>
                <div class="player-details">
                    <span class="player-number">01</span>
                    <h3>Roberto Gómez</h3>
                    <p class="txt-red txt-bold uppercase" style="font-size:0.8rem;">Guardameta</p>
                </div>
            </article>
        </div>

        <!-- Defensas -->
        <h2 class="roster-category">DEFENSAS</h2>
        <div class="roster-grid">
            <article class="player-profile">
                <div class="player-photo">
                    <img src="../imagen.png" alt="Jugador" style="border-radius:0; border:none; padding:0; width:150px; opacity:0.8;">
                </div>
                <div class="player-details">
                    <span class="player-number">03</span>
                    <h3>Alejandro Vargas</h3>
                    <p class="txt-red txt-bold uppercase" style="font-size:0.8rem;">Defensa Central</p>
                </div>
            </article>
            <article class="player-profile">
                <div class="player-photo">
                    <img src="../imagen.png" alt="Jugador" style="border-radius:0; border:none; padding:0; width:150px; opacity:0.8;">
                </div>
                <div class="player-details">
                    <span class="player-number">05</span>
                    <h3>Carlos Díaz</h3>
                    <p class="txt-red txt-bold uppercase" style="font-size:0.8rem;">Lateral Derecho</p>
                </div>
            </article>
        </div>
        
        <!-- Repetir estructura para MEDIOS y DELANTEROS según la plantilla real -->
    </main>

    <footer class="footer">
        <p>© 2026 Club de Fútbol Charales de Chapala. Desarrollado por <span class="txt-blue-bold">DIGITALITY</span>.</p>
    </footer>
</body>
</html>
